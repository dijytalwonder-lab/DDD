<head>
<meta charset="utf-8">

<!--
    viewport-fit=cover lets the canvas run under the notch and the gesture
    bar; user-scalable=no keeps a double-tap during play from zooming the game.
-->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#1a0f2e">
<title>Diwali Delivery Dash</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a0f2e;
        overscroll-behavior: none;
    }

    /* Stops a long press on the canvas offering to select or copy it */
    body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }

    #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #game-container canvas {
        display: block;
    }
</style>
</head>

<body>

<div id="game-container"></div>

<script type="module" src="/src/main.js"></script>

</body>
